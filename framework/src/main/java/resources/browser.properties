#Browser Configuration File

#Run WebDriver in headless mode or not (true or false)
#[2020-02-18]: Neither IE11 nor MS Edge can be run headless at the moment
#https://stackoverflow.com/questions/46645307/how-to-set-capability-for-ie-browser-to-run-in-headless-mode
is_headless=true

#Browser to test in: Chrome, Firefox, MSEdge, Opera
#Note: MSEdge is currently broken - working on a fix!
browser=Chrome

#Browser Driver Versions:
# https://github.com/bonigarcia/webdrivermanager/blob/master/src/main/resources/versions.properties
# https://www.nuget.org/packages/Selenium.InternetExplorer.WebDriver/

# Browser: Mozilla Firefox - Driver: geckodriver
# Source: https://github.com/mozilla/geckodriver/releases
firefox_version=4.35.0

# Browser: Microsoft Edge - Driver: msedgedriver
# Source: https://developer.microsoft.com/en-us/microsoft-edge/tools/webdriver/
ms_edge_version=142.0.3539.0

# Browser: Google Chrome and Chromium - Driver: chromedriver
# Sources: https://googlechromelabs.github.io/chrome-for-testing/#stable
# Sources: http://chromedriver.chromium.org/downloads
chromedriver_version=140.0.7339.80

# Browser: Opera - Driver: operadriver
# Source: https://github.com/operasoftware/operachromiumdriver/releases
opera_version=137.0.7151.122
